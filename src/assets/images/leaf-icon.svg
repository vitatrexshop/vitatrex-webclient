<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="leafGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6F165" />
      <stop offset="35%" stop-color="#A8E038" />
      <stop offset="75%" stop-color="#8EC826" />
      <stop offset="100%" stop-color="#6B9E11" />
    </linearGradient>
    <linearGradient id="leafGradBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8EC826" />
      <stop offset="50%" stop-color="#6B9E11" />
