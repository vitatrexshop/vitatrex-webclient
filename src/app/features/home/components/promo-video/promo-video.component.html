<!-- ══════════════════════════════════════════════════════════════
     VITATRIX PROMO VIDEO — Section 2
     Dynamic video from /api/v1/settings/promo-video
     80vw centered container, GSAP ScrollTrigger entrance
     ══════════════════════════════════════════════════════════════ -->

<!-- ── SKELETON LOADER ───────────────────────────────────────── -->
<section
  *ngIf="isLoading"
  class="promo-video-section promo-video-section--skeleton"
  aria-busy="true"
  aria-label="جاري تحميل الفيديو"
>
  <div class="promo-video-container">
    <div class="sk-video sk-shimmer">
      <div class="sk-play-icon sk-shimmer"></div>
    </div>
    <!-- Editorial Statement Skeleton (Prevents Layout Shift) -->
    <div class="sk-statement" aria-hidden="true">
      <div class="sk-statement-title sk-shimmer"></div>
      <div class="sk-statement-desc sk-shimmer"></div>
    </div>
  </div>
</section>

<!-- ── LOADED PROMO VIDEO SECTION ────────────────────────────── -->
<section
  #videoSection
  *ngIf="!isLoading"
  class="promo-video-section"
  aria-label="الفيديو الترويجي"
>


  <div class="promo-video-container">

    <!-- Video Wrapper (80vw premium frame, clickable to play/pause) -->
    <div
      class="promo-video-frame"
      (click)="togglePlay($event)"
      role="region"
      aria-label="مشغل الفيديو"
    >

      <!-- ── HTML5 Video Player ────────────────────────────────── -->
      <video
        #videoEl
        class="promo-video-el"
        [src]="videoUrl"
        [poster]="posterUrl"
        [muted]="isMuted"
        playsinline
        webkit-playsinline
        loop
        preload="none"
        (play)="onPlay()"
        (pause)="onPause()"
        (playing)="onPlay()"
        (ended)="onVideoEnded()"
        (error)="onVideoError($event)"
        aria-label="فيديو ترويجي Vitatrex"
      ></video>

      <!-- Custom Overlay Controls (Bottom Bar) -->
      <div class="promo-video-controls" (click)="$event.stopPropagation()">
        <!-- Play / Pause Button -->
        <button
          class="ctrl-btn ctrl-play"
          type="button"
          [attr.aria-label]="isPlaying ? 'إيقاف مؤقت' : 'تشغيل'"
          (click)="togglePlay($event)"
          id="promo-play-btn"
        >
          <svg *ngIf="!isPlaying" viewBox="0 0 24 24" fill="currentColor" width="26" height="26" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg *ngIf="isPlaying" viewBox="0 0 24 24" fill="currentColor" width="26" height="26" aria-hidden="true">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <!-- Mute / Unmute Toggle -->
        <button
          class="ctrl-btn ctrl-mute"
          type="button"
          [attr.aria-label]="isMuted ? 'تشغيل الصوت' : 'كتم الصوت'"
          (click)="toggleMute($event)"
          id="promo-mute-btn"
        >
          <svg *ngIf="isMuted" viewBox="0 0 24 24" fill="currentColor" width="22" height="22" aria-hidden="true">
            <path d="M16.5 12A4.5 4.5 0 0014 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0021 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06A8.99 8.99 0 0017.73 18l1.98 1.98L21 18.7 5.3 3 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
          <svg *ngIf="!isMuted" viewBox="0 0 24 24" fill="currentColor" width="22" height="22" aria-hidden="true">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
      </div>

      <!-- Large Glowing Center Play Button (Shown when paused) -->
      <button
        *ngIf="!isPlaying"
        class="promo-center-play"
        type="button"
        (click)="togglePlay($event)"
        id="promo-center-play-btn"
        aria-label="تشغيل الفيديو"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" width="38" height="38" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

    </div><!-- /.promo-video-frame -->

    <!-- Editorial Statement Strip Below Video -->
    <div class="promo-video-statement">
      <div class="statement-headline-wrap">
        <!-- Playful Hand-Drawn Sparkle & Starburst Doodle Accent -->
        <div class="statement-sparkle-doodle" aria-hidden="true">
          <svg viewBox="0 0 64 64" class="sparkle-svg" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="sparkle-star primary-star" d="M32 4 C32 18, 38 24, 52 24 C38 24, 32 30, 32 44 C32 30, 26 24, 12 24 C26 24, 32 18, 32 4 Z" fill="url(#sparkleGrad)" />
            <path class="sparkle-star secondary-star" d="M50 40 C50 46, 53 49, 59 49 C53 49, 50 52, 50 58 C50 52, 47 49, 41 49 C47 49, 50 46, 50 40 Z" fill="url(#sparkleGrad)" />
            <circle class="spark-dot" cx="16" cy="46" r="2.5" fill="#f59e0b" />
            <defs>
              <linearGradient id="sparkleGrad" x1="12" y1="4" x2="52" y2="44" gradientUnits="userSpaceOnUse">
                <stop stop-color="#10b981" />
                <stop offset="1" stop-color="#059669" />
              </linearGradient>
            </defs>
          </svg>
        </div>

        <h2 class="statement-headline">
          {{ videoTitle || ('PROMO_VIDEO.STATEMENT_TITLE' | translate) }}
        </h2>

        <!-- Organic Hand-Drawn Curved Swoosh Underline -->
        <div class="statement-brush-swoosh" aria-hidden="true">
          <svg viewBox="0 0 160 20" class="swoosh-svg" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="swoosh-path" d="M6 14 C 45 4, 115 5, 154 12" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" />
          </svg>
        </div>
      </div>

      <p class="statement-body">
        {{ videoSubtitle || ('PROMO_VIDEO.STATEMENT_DESC' | translate) }}
      </p>
    </div>

  </div><!-- /.promo-video-container -->
</section>
