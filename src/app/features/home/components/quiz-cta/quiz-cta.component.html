<section class="quiz-cta container">
  <div class="quiz-cta__inner">
    <div class="quiz-cta__content">
      <span class="quiz-cta__badge">{{ 'QUIZ_CTA.BADGE' | translate }}</span>
      <h2 class="quiz-cta__title">
        {{ 'QUIZ_CTA.TITLE' | translate }}
      </h2>
      <p class="quiz-cta__desc">
        {{ 'QUIZ_CTA.DESC' | translate }}
      </p>
      <a routerLink="/quiz" class="btn btn--amber btn--lg">
        {{ 'QUIZ_CTA.START_BTN' | translate }}
      </a>
    </div>
    <div class="quiz-cta__visual" aria-hidden="true">
      <span class="gummy-floating gum-1">🍓</span>
      <span class="gummy-floating gum-2">🍏</span>
      <span class="gummy-floating gum-3">🧪</span>
    </div>
  </div>
</section>
