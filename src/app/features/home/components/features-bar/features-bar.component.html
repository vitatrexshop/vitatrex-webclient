<section class="features-bar container">
  <div class="features-grid">
    <article class="feature-card" *ngFor="let item of features">
      <div class="feature-card__icon" aria-hidden="true">
        <!-- Natural / Leaf -->
        <svg *ngIf="item.type === 'natural'" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>

        <!-- Sugar Free / Check Sparkle -->
        <svg *ngIf="item.type === 'sugar_free'" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>

        <!-- Certified Quality / Shield Check -->
        <svg *ngIf="item.type === 'quality'" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>

        <!-- Shipping / Fast Delivery Truck -->
        <svg *ngIf="item.type === 'shipping'" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="15" height="13"/>
          <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
          <circle cx="5.5" cy="18.5" r="2.5"/>
          <circle cx="18.5" cy="18.5" r="2.5"/>
        </svg>
      </div>
      <div class="feature-card__content">
        <h3 class="feature-card__title">{{ item.titleKey | translate }}</h3>
        <p class="feature-card__desc">{{ item.descKey | translate }}</p>
      </div>
    </article>
  </div>
</section>
