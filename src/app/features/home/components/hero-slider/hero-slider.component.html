<!-- ══════════════════════════════════════════════════════════════
     VITATRIX HERO SECTION
     Block A: Ultra-Minimalist GSAP Typography Strip
     Block B: Edge-to-Edge Banner + ScrollTrigger Floating Elements
     ══════════════════════════════════════════════════════════════ -->

<!-- ── SKELETON LOADER ───────────────────────────────────────── -->
<section
  *ngIf="isLoading"
  class="hero-section hero-section--skeleton"
  aria-busy="true"
  aria-label="جاري تحميل البانر الرئيسي"
>
  <div class="hero-text-strip">
    <div class="sk-brand sk-shimmer"></div>
    <div class="sk-slogan sk-shimmer"></div>
  </div>
  <div class="hero-banner-bleed">
    <div class="sk-image-box sk-shimmer"></div>
  </div>
</section>

<!-- ── LOADED HERO SECTION ───────────────────────────────────── -->
<section
  #heroWrapper
  *ngIf="!isLoading"
  class="hero-section"
  aria-label="البانر الرئيسي"
>

  <!-- ══ BLOCK A: ULTRA-MINIMALIST TYPOGRAPHY STRIP ══════════════ -->
  <header class="hero-text-strip">

    <!-- ── Background Floating Fruits & Sparkles (Decorative) ──── -->
    <div class="hero-bg-anim" aria-hidden="true">

      <!-- Row 1: Big scattered fruits -->
      <span class="bg-fruit fruit-1">🍓</span>
      <span class="bg-fruit fruit-2">🍊</span>
      <span class="bg-fruit fruit-3">🫐</span>
      <span class="bg-fruit fruit-4">🍋</span>
      <span class="bg-fruit fruit-5">🍇</span>
      <span class="bg-fruit fruit-6">🥝</span>
      <span class="bg-fruit fruit-7">🍒</span>
      <span class="bg-fruit fruit-8">🍉</span>
      <span class="bg-fruit fruit-9">🍑</span>
      <span class="bg-fruit fruit-10">🍏</span>
      <span class="bg-fruit fruit-11">🌿</span>
      <span class="bg-fruit fruit-12">⭐</span>

      <!-- Sparkle dots -->
      <span class="bg-sparkle sp-1">✦</span>
      <span class="bg-sparkle sp-2">✦</span>
      <span class="bg-sparkle sp-3">✧</span>
      <span class="bg-sparkle sp-4">✦</span>
      <span class="bg-sparkle sp-5">✧</span>
      <span class="bg-sparkle sp-6">✦</span>
      <span class="bg-sparkle sp-7">✧</span>
      <span class="bg-sparkle sp-8">✦</span>

      <!-- Doodle arrows -->
      <svg class="bg-arrow arrow-1" viewBox="0 0 80 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 30 C 20 8, 50 10, 44 32 C 38 52, 16 42, 22 28 C 30 14, 66 20, 72 48" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
        <path d="M62 38 L 73 49 L 78 35" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
      </svg>
      <svg class="bg-arrow arrow-2" viewBox="0 0 80 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M72 30 C 60 8, 30 10, 36 32 C 42 52, 64 42, 58 28 C 50 14, 14 20, 8 48" stroke="#22c55e" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
        <path d="M18 38 L 7 49 L 2 35" stroke="#22c55e" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
      </svg>
      <svg class="bg-arrow arrow-3" viewBox="0 0 60 80" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 8 C 8 20, 10 50, 32 44 C 52 38, 42 16, 28 22 C 14 30, 20 66, 48 72" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55"/>
        <path d="M38 62 L 49 73 L 53 58" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.55"/>
      </svg>
      <svg class="bg-arrow arrow-4" viewBox="0 0 60 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 20 Q 20 5 40 20 Q 55 32 50 35" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
        <path d="M40 28 L 51 36 L 52 22" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
      </svg>

      <!-- Circular orbit rings (pure CSS) -->
      <div class="orbit-ring ring-1"></div>
      <div class="orbit-ring ring-2"></div>
    </div>

    <div class="hero-logo-wrapper">
      <img
        src="assets/logo.png"
        [alt]="brandName"
        class="hero-brand-logo-img"
        width="280"
        height="75"
        loading="eager"
      />
    </div>
    <p class="hero-slogan" *ngIf="slogan">{{ slogan }}</p>
  </header>

  <!-- ══ BLOCK B: EDGE-TO-EDGE BANNER IMAGE ══════════════════════ -->
  <div class="hero-banner-bleed">
    <div class="hero-banner-frame">
      <img
        [src]="heroImageUrl"
        [alt]="brandName + ' - ' + slogan"
        class="hero-banner-img"
        loading="eager"
        decoding="async"
      />

      <!-- ScrollTrigger Floating Gummies & Fruits -->
      <div class="hero-floating-elements" aria-hidden="true">
        <div class="floating-item floating-left item-1"><div class="floating-bubble bubble-glow-red">🍓</div></div>
        <div class="floating-item floating-left item-2"><div class="floating-bubble bubble-glow-green">🍏</div></div>
        <div class="floating-item floating-left item-3"><div class="floating-bubble bubble-glow-orange">🍊</div></div>
        <div class="floating-item floating-left item-7"><div class="floating-bubble bubble-glow-purple">🍇</div></div>
        <div class="floating-item floating-left item-8"><div class="floating-bubble bubble-glow-red">🍒</div></div>
        <div class="floating-item floating-left item-11"><div class="floating-bubble bubble-glow-pink">🍉</div></div>

        <div class="floating-item floating-right item-4"><div class="floating-bubble bubble-glow-blue">🫐</div></div>
        <div class="floating-item floating-right item-5"><div class="floating-bubble bubble-glow-yellow">🍋</div></div>
        <div class="floating-item floating-right item-6"><div class="floating-bubble bubble-glow-gold">⭐</div></div>
        <div class="floating-item floating-right item-9"><div class="floating-bubble bubble-glow-green">🥝</div></div>
        <div class="floating-item floating-right item-10"><div class="floating-bubble bubble-glow-orange">🍑</div></div>
        <div class="floating-item floating-right item-12"><div class="floating-bubble bubble-glow-emerald">🌿</div></div>
      </div>
    </div>
  </div>

  <!-- ══ BLOCK C: EDITORIAL BRAND MANIFESTO STRIP ═══════════════ -->
  <div class="hero-manifesto-strip">
    <div class="manifesto-headline-wrap">
      <!-- Playful Hand-Drawn Curly Doodle Arrow Pointing to Headline -->
      <div class="manifesto-curly-arrow" aria-hidden="true">
        <svg viewBox="0 0 100 85" class="curly-arrow-svg" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path class="arrow-loop" d="M12 28 C 28 8, 64 10, 58 36 C 52 58, 20 48, 30 28 C 40 8, 82 14, 90 62" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="arrow-head" d="M78 54 L 91 63 L 96 48" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h2 class="manifesto-headline">
        {{ 'HERO.MANIFESTO_TITLE' | translate }}
      </h2>
    </div>

    <p class="manifesto-body">
      {{ 'HERO.MANIFESTO_DESC' | translate }}
    </p>
  </div>

</section>
