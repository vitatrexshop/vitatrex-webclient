<main class="shop-page container">
  <!-- ── 1. Shop Header ───────────────────────────────────────── -->
  <header class="shop-header">
    <div class="shop-header-badge">
      <span>{{ 'NAV.SHOP' | translate }}</span>
    </div>
    <h1 class="shop-header__title">{{ 'SHOP.PAGE_TITLE' | translate }}</h1>
    <p class="shop-header__subtitle">{{ 'SHOP.PAGE_SUBTITLE' | translate }}</p>
  </header>

  <!-- ── 2. Filter Bar & Search ───────────────────────────────── -->
  <section class="shop-filters-bar" aria-label="Filters and Search">
    <!-- Dynamic Category Selector Chips -->
    <div class="category-chips-scroll" role="group" aria-label="Product categories" *ngIf="tabs$ | async as tabs">
      <button
        *ngFor="let tab of tabs; trackBy: trackByTab"
        type="button"
        class="chip-360"
        [class.is-active]="selectedCategory$.value === tab.id || selectedCategory$.value === tab.slug"
        (click)="setCategory(tab.id)"
      >
        <img *ngIf="tab.icon?.startsWith('http')" [src]="tab.icon" alt="" class="chip-icon" loading="lazy" decoding="async" />
        <span>{{ tab.name }}</span>
      </button>
    </div>

    <!-- Modern Search Input -->
    <div class="shop-search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7.5"/>
        <path d="M21 21l-4.35-4.35"/>
      </svg>
      <input
        class="search-input"
        type="search"
        dir="auto"
        [placeholder]="'SHOP.SEARCH_INPUT_PLACEHOLDER' | translate"
        [formControl]="searchControl"
        [attr.aria-label]="'SHOP.SEARCH_INPUT_PLACEHOLDER' | translate"
      />
    </div>
  </section>

  <!-- ── 3. Unified Shop Grid ─────────────────────────────────── -->
  <section class="shop-grid-section">
    <div
      class="grid-360"
      [class.grid-360--bundles]="vm.isBundleTab"
      *ngIf="vm$ | async as vm; else loading"
    >
      <!-- 3a. "اصنع باقتك" Bundle Cards (shown in 'all' and 'bundle' tabs) -->
      <ng-container *ngIf="vm.showBundles">
        <app-shop-bundle-card
          *ngFor="let bundle of vm.bundles; trackBy: trackByBundle"
          [bundle]="bundle"
          (buildBundle)="openBundleBuilder(bundle)"
        ></app-shop-bundle-card>
      </ng-container>

      <!-- 3b. Promotional Offers (shown in 'bundle' tab) -->
      <ng-container *ngIf="vm.showOffers">
        <app-offer-card
          *ngFor="let off of vm.offers; trackBy: trackByOffer"
          [offer]="off"
        ></app-offer-card>
      </ng-container>

      <!-- 3c. Regular Products (shown in 'all' and category tabs, NOT in 'bundle') -->
      <ng-container *ngIf="vm.showProducts">
        <app-product-card
          *ngFor="let prod of vm.products; let i = index; trackBy: trackByProduct"
          [product]="prod"
          [priority]="i < 3"
        ></app-product-card>
      </ng-container>

      <!-- 3d. Empty State Message & Action -->
      <div class="no-results-box" *ngIf="vm.isEmpty">
        <div class="no-results-icon">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <h3 class="no-results-title">
          {{ (vm.isBundleTab ? 'SHOP.NO_BUNDLES_TITLE' : 'SHOP.NO_PRODUCTS_TITLE') | translate }}
        </h3>
        <p class="no-results-desc" *ngIf="!vm.isBundleTab">
          {{ 'SHOP.NO_PRODUCTS_SUB' | translate }}
        </p>
        <button
          type="button"
          class="no-results-btn"
          (click)="searchControl.reset(); setCategory('all')"
        >
          {{ 'SHOP.VIEW_ALL_PRODUCTS' | translate }}
        </button>
      </div>
    </div>
  </section>

  <!-- ── 4. Shimmer Loader ────────────────────────────────────── -->
  <ng-template #loading>
    <div class="grid-360" aria-busy="true" aria-label="جاري التحميل">
      <div class="skeleton-card-360" *ngFor="let i of [1,2,3,4,5,6]"></div>
    </div>
  </ng-template>

  <!-- ── 5. Interactive Bundle Builder Dialog ──────────────────── -->
  <app-bundle-card
    *ngIf="selectedBundleForBuilder"
    [modalBundle]="selectedBundleForBuilder"
    (closeModal)="closeBundleBuilder()"
  ></app-bundle-card>
</main>
