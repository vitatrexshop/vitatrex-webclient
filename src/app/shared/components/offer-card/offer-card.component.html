<article class="offer-card" *ngIf="offer">
  <!-- ── Top Image & Badges Layout ── -->
  <div class="offer-card__image-stage">
    <a routerLink="/shop" class="offer-card__image-link" [attr.aria-label]="offer.title">
      <img
        [src]="offer.image"
        [alt]="offer.title"
        loading="lazy"
        decoding="async"
        class="offer-card__image"
      />
    </a>
    <!-- Pill badge at top-right over image -->
    <div class="offer-card__top-badge">
      {{ offer.badgeText || 'وفر أكثر' }}
    </div>
  </div>

  <!-- ── Card Content Body ── -->
  <div class="offer-card__content" dir="rtl">
    <!-- Secondary Badge Above Title -->
    <div class="offer-card__secondary-badge">
      {{ offer.badgeText || 'وفر أكثر' }}
    </div>

    <!-- Title -->
    <h3 class="offer-card__title">{{ offer.title }}</h3>

    <!-- Price & Save Icon Row -->
    <div class="offer-card__price-row">
      <div class="offer-card__price-group">
        <span class="offer-card__primary-price">
          {{ offer.offerPrice | number }} {{ 'COMMON.CURRENCY' | translate }}
        </span>
        <del
          class="offer-card__orig-price"
          *ngIf="offer.originalPrice > offer.offerPrice"
        >
          {{ offer.originalPrice | number }} {{ 'COMMON.CURRENCY' | translate }}
        </del>
      </div>

      <!-- Right Side: Circular outline icon box + 'أوفر Save' -->
      <div class="offer-card__save-box">
        <div class="offer-card__circle-icon">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor">
            <path d="M7.5 4a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm0 5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm9 6a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm0 5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zM18.7 4.3a1 1 0 0 0-1.4 0l-12 12a1 1 0 1 0 1.4 1.4l12-12a1 1 0 0 0 0-1.4z"/>
          </svg>
        </div>
        <span class="offer-card__save-label">أوفر Save</span>
      </div>
    </div>

    <!-- Full-Width Dark Purple Outline CTA Button -->
    <a routerLink="/shop" class="offer-card__cta-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
      <span>{{ 'OFFERS_SECTION.ADD_TO_CART' | translate }}</span>
    </a>
  </div>
</article>
